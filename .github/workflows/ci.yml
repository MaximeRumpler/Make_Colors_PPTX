name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Job names "test (3.9)" and "test (3.12)": keep them, branch protection can require them.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      MAKE_CLEAN_PPTX_DIR: ${{ github.workspace }}/make-clean
    steps:
      - uses: actions/checkout@v7
      # Round trip: Make_Clean_PPTX (public) loads the themes built here and builds a deck with them.
      - uses: actions/checkout@v7
        with:
          repository: MaximeRumpler/Make_Clean_PPTX
          ref: v1.2.0
          path: make-clean
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r make-clean/skills/make-clean-pptx/requirements.txt
      - run: pytest
