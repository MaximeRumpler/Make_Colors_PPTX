<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Make_Colors_PPTX</title>
  <desc id="d">Your brand colours and fonts on a clean deck made with Make_Clean_PPTX.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2333"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="48" y="48" width="6" height="64" rx="3" fill="url(#acc)"/>

  <text x="72" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Make_Colors_PPTX</text>
  <text x="72" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9AA5B8">Your brand on a clean deck, in one step.</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="176" width="150" height="34" rx="17" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="147" y="198" text-anchor="middle" fill="#34D399">AGENT SKILL</text>
    <rect x="236" y="176" width="210" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="341" y="198" text-anchor="middle" fill="#9AA5B8">BRAND GUIDE · SITE</text>
    <rect x="460" y="176" width="170" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="545" y="198" text-anchor="middle" fill="#9AA5B8">PPTX THEME</text>
  </g>

  <!-- the same clean slide, before and after the theme -->
  <g transform="translate(790 46)">
    <rect x="70" y="0" width="300" height="170" rx="10" fill="#243049" stroke="#3B4660"/>
    <rect x="35" y="36" width="300" height="170" rx="10" fill="#2A3753" stroke="#3B4660"/>
    <rect x="0" y="72" width="300" height="170" rx="10" fill="#FFFFFF"/>
    <rect x="0" y="72" width="300" height="10" rx="5" fill="#0F4C81"/>
    <rect x="24" y="96" width="140" height="14" rx="4" fill="#0F4C81"/>
    <rect x="24" y="122" width="96" height="8" rx="4" fill="#C9D6E3"/>
    <rect x="24" y="138" width="116" height="8" rx="4" fill="#C9D6E3"/>
    <rect x="24" y="154" width="84" height="8" rx="4" fill="#C9D6E3"/>
    <rect x="184" y="150" width="18" height="52" fill="#0F4C81"/>
    <rect x="208" y="128" width="18" height="74" fill="#5B8DB8"/>
    <rect x="232" y="108" width="18" height="94" fill="#F2A541"/>
    <rect x="256" y="138" width="18" height="64" fill="#A9C1D9"/>
    <rect x="180" y="204" width="98" height="1.5" fill="#D9D9D9"/>
    <rect x="24" y="190" width="60" height="6" rx="3" fill="#F2A541"/>
  </g>
</svg>
